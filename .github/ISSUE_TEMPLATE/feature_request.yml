name: Feature Request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: dropdown
    id: server
    attributes:
      label: Server
      options:
        - tracehub-mcp
        - cost-guard-mcp
        - new server idea (see org Discussions instead)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: false
