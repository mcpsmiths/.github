name: Bug Report
description: Report a problem with one of the mcpsmiths MCP servers
labels: ["bug"]
body:
  - type: dropdown
    id: server
    attributes:
      label: Server
      options:
        - tracehub-mcp
        - cost-guard-mcp
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show <package>` or similar
    validations:
      required: false
